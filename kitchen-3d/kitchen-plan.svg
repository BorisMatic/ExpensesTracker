<?xml version="1.0" encoding="UTF-8"?>
<!-- Kitchen floor plan, traced from the architectural drawing. Units: centimetres.
     Origin (0,0) = inner back-left corner of the room. x → right, y → toward the open front. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 420 400" width="840" height="800" font-family="'IBM Plex Mono', monospace">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="0.8"/>
    </pattern>
    <marker id="tick" viewBox="-3 -3 6 6" markerWidth="6" markerHeight="6" orient="auto">
      <line x1="-2.5" y1="2.5" x2="2.5" y2="-2.5" stroke="#111" stroke-width="1"/>
    </marker>
  </defs>
  <rect x="-80" y="-80" width="420" height="400" fill="#ffffff"/>

  <!-- Floor (tiles 120 × 60) -->
  <rect x="0" y="0" width="228" height="235" fill="#efe6d6"/>
  <g stroke="#cdbfa5" stroke-width="0.5" fill="none">
    <line x1="0" y1="60" x2="228" y2="60"/><line x1="0" y1="120" x2="228" y2="120"/><line x1="0" y1="180" x2="228" y2="180"/>
    <line x1="108" y1="0" x2="108" y2="60"/><line x1="118" y1="60" x2="118" y2="120"/>
    <line x1="128" y1="120" x2="128" y2="180"/><line x1="138" y1="180" x2="138" y2="235"/>
  </g>

  <!-- Walls -->
  <g stroke="#111" stroke-width="1.2">
    <rect x="-12" y="-12" width="240" height="12" fill="#bdbdbd"/>          <!-- back wall 12 (bathroom side) -->
    <rect x="-12" y="0" width="12" height="235" fill="#bdbdbd"/>            <!-- left wall 12 -->
    <rect x="228" y="-12" width="20" height="247" fill="url(#hatch)"/>      <!-- exterior wall 20 -->
  </g>
  <line x1="0" y1="235" x2="228" y2="235" stroke="#111" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="114" y="250" font-size="7" text-anchor="middle" fill="#555">OPEN TO LIVING AREA</text>

  <!-- Planned units (from drawing) -->
  <g fill="#ffffff" fill-opacity="0.85" stroke="#222" stroke-width="0.7">
    <!-- left run, 62 deep -->
    <rect x="0" y="0" width="62" height="113"/>
    <rect x="0" y="113" width="62" height="61"/>
    <rect x="0" y="174" width="62" height="61"/>
    <!-- back run with hob -->
    <rect x="62" y="0" width="106" height="60" stroke-dasharray="2 1.5"/>
    <!-- right run along exterior wall, 60 deep -->
    <rect x="168" y="0" width="60" height="106"/>
    <rect x="168" y="106" width="60" height="60"/>
    <rect x="168" y="166" width="60" height="69"/>
  </g>
  <!-- hob -->
  <g fill="none" stroke="#222" stroke-width="0.7" stroke-dasharray="2 1.5">
    <rect x="70" y="3" width="62" height="52"/>
    <circle cx="84" cy="17" r="8"/><circle cx="117" cy="17" r="6.5"/>
    <circle cx="84" cy="41" r="6.5"/><circle cx="117" cy="41" r="9"/>
  </g>
  <!-- sink (round) with tap to the exterior wall -->
  <g fill="none" stroke="#222" stroke-width="0.8">
    <circle cx="202" cy="79" r="20"/>
    <circle cx="202" cy="79" r="18" stroke-dasharray="2 1.5"/>
    <line x1="203" y1="79" x2="226" y2="79"/>
  </g>
  <!-- washing machine / dishwasher -->
  <g fill="none" stroke="#222" stroke-width="0.7" stroke-dasharray="2 1.5">
    <circle cx="202" cy="136" r="21"/>
    <line x1="182" y1="136" x2="209" y2="136"/><line x1="202" y1="127" x2="202" y2="145"/>
    <rect x="164" y="118" width="4" height="40"/>
  </g>
  <!-- tall integrated fridge, floor to ceiling -->
  <g fill="none" stroke="#222" stroke-width="0.7">
    <line x1="168" y1="166" x2="228" y2="235"/><line x1="228" y1="166" x2="168" y2="235"/>
    <rect x="165" y="168" width="3" height="65" fill="#fff"/>
  </g>
  <!-- free floor zone (dashed in drawing) -->
  <rect x="66" y="60" width="78" height="175" fill="none" stroke="#777" stroke-width="0.6" stroke-dasharray="1.5 1.5"/>

  <!-- Wall cabinets 35 deep, 145 cm to ceiling (shown dashed, above) -->
  <g fill="none" stroke="#b0602a" stroke-width="0.8" stroke-dasharray="4 2">
    <rect x="0" y="0" width="71" height="35"/>
    <rect x="71" y="0" width="60" height="35"/>
    <rect x="131" y="0" width="62" height="35"/>
    <rect x="193" y="0" width="35" height="166"/>
    <line x1="193" y1="55" x2="228" y2="55"/><line x1="193" y1="110" x2="228" y2="110"/>
  </g>
  <!-- Oak shelves on left wall, 22 deep -->
  <rect x="0" y="75" width="22" height="90" fill="#c9955e" fill-opacity="0.35" stroke="#8a5a2b" stroke-width="0.7"/>
  <text x="11" y="122" font-size="4.5" fill="#6b4420" text-anchor="middle" transform="rotate(-90 11 120)">SHELVES</text>
  <text x="101" y="31" font-size="4.5" fill="#b0602a" text-anchor="middle">UPPER ABOVE HOOD</text>

  <!-- Labels -->
  <g font-size="6" fill="#333" text-anchor="middle">
    <text x="31" y="58">TALL / BASE</text>
    <text x="31" y="146">BASE</text>
    <text x="31" y="207">BASE</text>
    <text x="101" y="66" font-size="5">HOB + HOOD</text>
    <text x="198" y="108" font-size="5">SINK</text>
    <text x="196" y="163" font-size="5">DISHWASHER</text>
    <text x="198" y="203" font-size="5.5">FRIDGE</text><text x="198" y="210" font-size="4">TALL, BUILT-IN</text>
  </g>

  <!-- Dimensions -->
  <g stroke="#111" stroke-width="0.6" marker-start="url(#tick)" marker-end="url(#tick)">
    <line x1="0" y1="-40" x2="228" y2="-40"/>
    <line x1="228" y1="-40" x2="248" y2="-40"/>
    <line x1="-12" y1="-40" x2="0" y2="-40"/>
    <line x1="275" y1="0" x2="275" y2="235"/>
    <line x1="275" y1="-12" x2="275" y2="0"/>
    <line x1="0" y1="275" x2="228" y2="275"/>
  </g>
  <g stroke="#999" stroke-width="0.3">
    <line x1="-12" y1="-12" x2="-12" y2="-46"/><line x1="0" y1="0" x2="0" y2="-46"/>
    <line x1="228" y1="-12" x2="228" y2="-46"/><line x1="248" y1="-12" x2="248" y2="-46"/>
    <line x1="248" y1="0" x2="281" y2="0"/><line x1="248" y1="235" x2="281" y2="235"/><line x1="248" y1="-12" x2="281" y2="-12"/>
    <line x1="0" y1="235" x2="0" y2="281"/><line x1="228" y1="235" x2="228" y2="281"/>
  </g>
  <g font-size="11" fill="#111" text-anchor="middle">
    <text x="114" y="-44">228</text>
    <text x="238" y="-44" font-size="8">20</text>
    <text x="-6" y="-44" font-size="8">12</text>
    <text x="114" y="271">228</text>
    <text x="0" y="0" transform="translate(271 118) rotate(-90)">235</text>
    <text x="0" y="0" font-size="8" transform="translate(271 -4) rotate(-90)">12</text>
  </g>
  <text x="-70" y="-62" font-size="9" fill="#111" font-weight="bold">KITCHEN · 228 × 235 cm · ≈ 5.36 m²</text>
  <text x="-70" y="312" font-size="6" fill="#555">Units: cm. Back wall 12, left wall 12, exterior wall 20 (hatched). Front side open.</text>
  <text x="-70" y="302" font-size="6" fill="#b0602a">Dashed orange: wall cabinets 35 deep, from 145 cm to ceiling (back + exterior wall).</text>
</svg>
